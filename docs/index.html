function ans(i){if(S.me.role!='Author')return toast('Only authors can answer');const x=v('an'+i);if(!x)return;S.fu.qa[i].ans=x;R()}
function rolesCard(){const R3=['Member','Author','Admin'],P=[['Browse books, join groups, post and review',1,1,1],['Create reading groups and polls',1,1,1],['Report content',1,1,1],['Publish books and promote them (Author Studio)',0,1,0],['Host author events and answer reader questions',0,1,0],['Open the Moderation tab and remove reported content',0,0,1],['Block and restore users',0,0,1],["Change other users' roles",0,0,1],['Approve requests and manage roles in any group',0,0,1]];
return `<div class="card" style="margin-top:20px"><h3>🔑 What each role can do</h3><p class="sub">You are signed in as <b>${S.me.role}</b>.</p><div style="overflow-x:auto"><table><tr><th>Capability</th>${R3.map(r=>`<th ${r==S.me.role?'style="background:var(--c);color:#fff"':''}>${r=='Member'?'Member (user)':r}</th>`).join('')}</tr>${P.map(p=>`<tr><td>${p[0]}</td>${[1,2,3].map(i=>`<td>${p[i]?'✅':'—'}</td>`).join('')}</tr>`).join('')}</table></div></div>`}
function setUserRole(n,r){if(!isAdmin())return;ACC[n].role=r;apiLog('PATCH','/api/users/:id/role',200);toast(n+' is now '+r);R()}
function vStudio(){const me=S.me.n,bs=B.filter(b=>b.a==me),rv=S.reviews.filter(r=>bs.some(b=>b.id==r.b)),ev=S.fu.ev.filter(e=>e.by==me),qs=S.fu.qa.map((x,i)=>[x,i]).filter(q=>q[0].a==me);
return `<h2 class="h">Author <span class="u">Studio</span></h2><p class="sub">Tools only authors have: publish, promote, host events and answer readers.</p>
<div class="stats">${[['📖',bs.length,'Books published'],['⭐',rv.length?(rv.reduce((a,r)=>a+r.r,0)/rv.length).toFixed(1):'–','Average rating'],['💬',rv.length,'Reader reviews'],['🎤',ev.length,'Events hosted'],['❓',qs.filter(q=>!q[0].ans).length,'Questions waiting']].map(x=>`<div class="card stat"><span>${x[0]}</span><b class="h">${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>
<div class="split" style="margin-top:20px"><div class="card"><h3>📚 My books</h3>${bs.map(b=>`<div class="row" style="margin:8px 0"><span>${b.e} <b>${esc(b.t)}</b> <span class="mute">${b.g} · ${avg(b.id)?stars(avg(b.id)):'no ratings yet'}</span> ${S.fu.fe.includes(b.id)?'<span class="chip on">⭐ Featured</span>':''}</span><button class="s" onclick="feat(${b.id})">${S.fu.fe.includes(b.id)?'Unfeature':'📣 Promote'}</button></div>`).join('')||'<span class="mute">No books yet.</span>'}<h3 style="margin-top:16px">Publish a new book</h3><div class="row"><input id="pt" placeholder="Book title"><select id="pg2">${G.map(g=>`<option>${g}</option>`).join('')}</select><button class="s p" onclick="publish()">Publish</button></div></div>
<div class="card"><h3>🎤 My events</h3>${ev.map(e=>`<div class="cm"><b>${esc(e.t)}</b><div class="mute">${e.m} · ${esc(e.d)} · ${e.n} attending</div></div>`).join('')||'<span class="mute">No events yet.</span>'}<div class="row"><input id="et" placeholder="Event title"><select id="em"><option>Virtual</option><option>Physical</option></select><input id="ed" placeholder="Day & time"><button class="s p" onclick="addEv()">Host</button></div></div></div>
<div class="card" style="margin-top:20px"><h3>❓ Reader questions</h3>${qs.map(q=>`<div class="cm"><b>Q:</b> ${esc(q[0].q)} <span class="mute">— ${esc(q[0].by)}</span><div>${q[0].ans?'<b>A:</b> '+esc(q[0].ans):`<div class="row"><input id="an${q[1]}" placeholder="Your answer"><button class="s p" onclick="ans(${q[1]})">Reply</button></div>`}</div></div>`).join('')||'<span class="mute">No questions yet.</span>'}</div>`}
</script></body></html>
